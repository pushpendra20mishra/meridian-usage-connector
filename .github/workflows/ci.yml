name: ci
on:
  push:
  pull_request:

jobs:
  checks:
    name: typecheck, rendered config, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: make lint
      - run: make check-provision
      - run: make test

  terraform:
    name: terraform validates and renders the same bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8, terraform_wrapper: false }
      - run: npm ci
      - run: make tf-check

  package:
    name: plugin + extension validate
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code
      - run: make verify-package
